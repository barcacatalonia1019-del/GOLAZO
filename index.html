<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>GOLAZO | توقعات كرة القدم</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
    header{background:#111;padding:20px;border-bottom:1px solid #b99132;display:flex;justify-content:space-between;align-items:center}
    .logo{font-size:27px;font-weight:900;color:#e7bd50;letter-spacing:2px}
    .menu{font-size:25px;color:#e7bd50}
    main{max-width:850px;margin:auto;padding:20px}
    .welcome{background:linear-gradient(135deg,#29210d,#111);border:1px solid #806522;border-radius:16px;padding:25px;margin:15px 0 25px}
    h1{color:#f0c65b;margin:0 0 10px}
    p{color:#aaa;line-height:1.7}
    .section-title{color:#e7bd50;font-size:20px;margin:25px 0 15px}
    .competition{background:#171717;border:1px solid #333;border-radius:12px;padding:17px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
    .competition span{font-weight:bold}
    .arrow{color:#e7bd50;font-size:22px}
    nav{display:flex;gap:8px;margin:20px 0}
    nav button{flex:1;background:#171717;border:1px solid #333;color:#ccc;padding:13px 5px;border-radius:9px;font-size:14px}
    nav button.active{background:#b99132;color:#090909;font-weight:bold}
    #content{min-height:150px}
    footer{text-align:center;color:#666;padding:30px;font-size:12px}
  </style>
</head>
<body>
  <header>
    <div class="logo">GOLAZO ⚽</div>
    <div class="menu">☰</div>
  </header>

  <main>
    <section class="welcome">
      <h1>أهلاً بك في GOLAZO</h1>
      <p>توقع نتائج المباريات، اجمع النقاط، وتحدى أصحابك!</p>
    </section>

    <nav>
      <button class="active" onclick="showTab('matches',this)">المباريات</button>
      <button onclick="showTab('ranking',this)">الترتيب</button>
      <button onclick="showTab('leagues',this)">دورياتي</button>
    </nav>

    <section id="content">
      <h2 class="section-title">البطولات الرسمية</h2>
      <div class="competition"><span>Premier League</span><b class="arrow">‹</b></div>
      <div class="competition"><span>LaLiga</span><b class="arrow">‹</b></div>
      <div class="competition"><span>Serie A</span><b class="arrow">‹</b></div>
      <div class="competition"><span>UEFA Champions League</span><b class="arrow">‹</b></div>
      <div class="competition"><span>FIFA World Cup</span><b class="arrow">‹</b></div>
      <div class="competition"><span>UEFA EURO</span><b class="arrow">‹</b></div>
    </section>
  </main>

  <footer>GOLAZO © 2026</footer>

  <script>
    function showTab(tab,button){
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
      button.classList.add('active');
      const content=document.getElementById('content');
      if(tab==='matches'){
        content.innerHTML='<h2 class="section-title">البطولات الرسمية</h2>'+['Premier League','LaLiga','Serie A','UEFA Champions League','FIFA World Cup','UEFA EURO'].map(x=>'<div class="competition"><span>'+x+'</span><b class="arrow">‹</b></div>').join('');
      }else if(tab==='ranking'){
        content.innerHTML='<h2 class="section-title">الترتيب العام</h2><p>سيظهر ترتيب اللاعبين ونقاطهم هنا.</p>';
      }else{
        content.innerHTML='<h2 class="section-title">دورياتي الخاصة</h2><p>أنشئ دوري مع أصحابك أو انضم لدوري باستخدام كود الدعوة.</p>';
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</html>
 <script>
window.addEventListener("load", function () {
  const main = document.querySelector("main");

  if (!main) {
    alert("لم يتم العثور على قسم الصفحة الرئيسي");
    return;
  }

  const authBox = document.createElement("section");

  authBox.style.cssText = 
    background:#171717;
    border:1px solid #d5ad43;
    border-radius:15px;
    padding:22px;
    margin:20px 0;
    text-align:center;
    color:white;
  ;

  authBox.innerHTML = 
    <h2 style="color:#e7bd50">GOLAZO ACCOUNT ⚽</h2>
    <p>سجل حسابك وابدأ تحدي أصحابك</p>

    <input id="auth-name" placeholder="الاسم"
      style="display:none;width:90%;padding:13px;margin:7px;background:#222;color:white;border:1px solid #555;border-radius:8px">

    <input id="auth-email" type="email" placeholder="البريد الإلكتروني"
      style="width:90%;padding:13px;margin:7px;background:#222;color:white;border:1px solid #555;border-radius:8px">

    <input id="auth-password" type="password" placeholder="كلمة المرور"
      style="width:90%;padding:13px;margin:7px;background:#222;color:white;border:1px solid #555;border-radius:8px">

    <button id="auth-submit"
      style="width:95%;padding:13px;margin-top:12px;background:#d5ad43;color:#111;border:0;border-radius:8px;font-weight:bold">
      تسجيل الدخول
    </button>

    <p id="auth-message" style="color:#e7bd50"></p>

    <button id="auth-switch"
      style="background:none;border:0;color:#e7bd50;padding:10px">
      إنشاء حساب جديد
    </button>

    <button id="auth-logout"
      style="display:none;background:#333;color:white;border:0;padding:10px;border-radius:8px">
      تسجيل الخروج
    </button>
  ;

  main.prepend(authBox);

  let isRegister = false;

  const name = document.getElementById("auth-name");
  const email = document.getElementById("auth-email");
  const password = document.getElementById("auth-password");
  const message = document.getElementById("auth-message");
  const submit = document.getElementById("auth-submit");
  const switchBtn = document.getElementById("auth-switch");
  const logout = document.getElementById("auth-logout");

  switchBtn.onclick = function () {
    isRegister = !isRegister;
    name.style.display = isRegister ? "block" : "none";
    submit.textContent = isRegister ? "إنشاء الحساب" : "تسجيل الدخول";
    switchBtn.textContent = isRegister
      ? "لديك حساب؟ سجل الدخول"
      : "إنشاء حساب جديد";
    message.textContent = "";
  };

  submit.onclick = async function () {
    const userEmail = email.value.trim();
    const userPassword = password.value;

    message.textContent = "جاري التنفيذ...";

    try {
      if (!userEmail || !userPassword) {
        throw new Error("اكتب البريد الإلكتروني وكلمة المرور");
      }

      if (isRegister) {
        const displayName = name.value.trim();

        if (!displayName) {
          throw new Error("اكتب اسمك");
        }

        const { data, error } = await supabaseClient.auth.signUp({
          email: userEmail,
          password: userPassword,
          options: {
            data: { display_name: displayName }
          }
        });

        if (error) throw error;

        message.textContent = data.session
          ? "تم إنشاء الحساب وتسجيل الدخول بنجاح"
          : "تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيده";
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: userEmail,
          password: userPassword
        });

        if (error) throw error;

        message.textContent = "تم تسجيل الدخول بنجاح ✅";
      }

      await updateAuthView();

    } catch (error) {
      message.textContent = "خطأ: " + error.message;
    }
  };

  async function updateAuthView() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
      message.textContent = error.message;
      return;
    }

    const loggedIn = !!data.session;
    if (loggedIn) {
      message.textContent = "أهلاً بك في GOLAZO ⚽";
      submit.style.display = "none";
      switchBtn.style.display = "none";
      name.style.display = "none";
      email.style.display = "none";
      password.style.display = "none";
      logout.style.display = "inline-block";
    } else {
      submit.style.display = "block";
      switchBtn.style.display = "inline-block";
      email.style.display = "block";
      password.style.display = "block";
      logout.style.display = "none";
    }
  }

  logout.onclick = async function () {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      message.textContent = error.message;
      return;
    }

    isRegister = false;
    submit.textContent = "تسجيل الدخول";
    switchBtn.textContent = "إنشاء حساب جديد";
    message.textContent = "تم تسجيل الخروج";
    await updateAuthView();
  };

  updateAuthView();
});
</script>
</body>
